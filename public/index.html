    <div class="container">
      <img
        class="Logo"
        src="/src/assets/logo.png"

        <h1 class="Heading-1">Happening now.</h1>
        <p class="Description">Join today.</p>
        <div class="Button-Group">
          <button id="SignIn-Google">
            <img src="/src/assets/image.png" />Sign in With Google
          </button>
          <button id="SignIn-Apple">
            <img src="/src/assets/image2.png" />Sign in With Apple
          </button>
          <div class="Separator"><span>or</span></div>
          <a href="register.html" class="Create"
            ><button id="Create-Account">Create Account</button></a
          >
          <p class="SignIn-text">Already have an account?</p>
          <a href="login.html" class="Login"
            ><button id="SignIn">Sign in</button></a
          >
        </div>

        <div class="footer">
